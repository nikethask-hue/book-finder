<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Book Finder</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>📚 Book Finder</h1>
      <div class="auth-bar">
        <p id="authStatus" class="auth-status">Not signed in</p>
        <button id="authButton" class="btn btn-auth">Sign in with Google</button>
      </div>
    </div>
    <p id="shareBanner" class="share-banner" hidden>Viewing a shared reading list.</p>
    <div class="email-auth-bar">
      <input
        type="email"
        id="emailInput"
        class="auth-input"
        placeholder="Email"
        aria-label="Email address"
      >
      <input
        type="password"
        id="passwordInput"
        class="auth-input"
        placeholder="Password"
        aria-label="Password"
      >
      <button id="emailSignInBtn" class="btn btn-auth-secondary">Email Sign In</button>
      <button id="emailRegisterBtn" class="btn btn-auth-secondary">Register</button>
    </div>
  </header>

  <main>
    <!-- Search Section -->
    <section class="search-section">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search books or authors…"
          aria-label="Search for books or authors"
        >
        <button id="searchBtn" class="search-button">Search</button>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <h2>Search Results</h2>
      <div id="results" class="results-grid" aria-label="Book search results"></div>
    </section>

    <!-- Reading List Section -->
    <section class="reading-list-section">
      <div class="reading-list-header">
        <h2>Reading List</h2>
        <div class="sort-controls">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect" class="sort-select" aria-label="Sort books by">
            <option value="date-desc">Date Added (Newest)</option>
            <option value="date-asc">Date Added (Oldest)</option>
            <option value="title">Title (A-Z)</option>
            <option value="author">Author (A-Z)</option>
          </select>
        </div>
      </div>
      <div id="bookStats" class="book-stats" style="display: none;">
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-label">Total Books</span>
            <span id="totalBooksCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Read</span>
            <span id="readCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Want to Read</span>
            <span id="wantToReadCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Favourites</span>
            <span id="favCount" class="stat-value">0</span>
          </div>
        </div>
      </div>
      <div id="reading-list" class="reading-list-grid" aria-label="Saved books"></div>
    </section>
    <section id="shareSection" class="share-section">
      <div class="share-container">
        <p class="share-text">Share a reading list — generate a simple shareable link or a readable page of your saved books.</p>
        <button id="shareBtn" class="btn btn-share">Generate share link</button>
        <p id="shareMessage" class="share-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
