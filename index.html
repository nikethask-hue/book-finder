<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Book Finder</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>📚 Book Finder</h1>
      <div class="auth-bar">
        <p id="authStatus" class="auth-status">Not signed in</p>
        <button id="authButton" class="btn btn-auth">Sign in with Google</button>
      </div>
    </div>
    <div class="email-auth-bar">
      <input
        type="email"
        id="emailInput"
        class="auth-input"
        placeholder="Email"
        aria-label="Email address"
      >
      <input
        type="password"
        id="passwordInput"
        class="auth-input"
        placeholder="Password"
        aria-label="Password"
      >
      <button id="emailSignInBtn" class="btn btn-auth-secondary">Email Sign In</button>
      <button id="emailRegisterBtn" class="btn btn-auth-secondary">Register</button>
    </div>
  </header>

  <main>
    <!-- Search Section -->
    <section class="search-section">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search books or authors…"
          aria-label="Search for books or authors"
        >
        <button id="searchBtn" class="search-button">Search</button>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <h2>Search Results</h2>
      <div id="results" class="results-grid" aria-label="Book search results"></div>
    </section>

    <!-- Reading Goal Section -->
    <section class="reading-goal-section">
      <div class="goal-container">
        <div class="goal-input-area">
          <h2>📖 Reading Goal</h2>
          <div class="goal-input-group">
            <input
              type="number"
              id="goalInput"
              class="goal-input"
              placeholder="Enter target number of books"
              min="1"
              aria-label="Reading goal target"
            >
            <button id="setGoalBtn" class="btn btn-set-goal">Set Goal</button>
          </div>
        </div>
        <div id="goalDisplay" class="goal-display" style="display: none;">
          <div class="goal-info">
            <span id="goalProgress" class="goal-progress-text">0 / 0 books read</span>
          </div>
          <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Shelf Management Section -->
    <section class="shelf-management-section">
      <h2>📚 My Shelves</h2>
      
      <!-- Stats Section -->
      <div id="bookStats" class="book-stats" style="display: none;">
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-label">Total Books</span>
            <span id="totalBooksCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Read</span>
            <span id="readCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Want to Read</span>
            <span id="wantToReadCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Favourites</span>
            <span id="favCount" class="stat-value">0</span>
          </div>
        </div>
      </div>

      <!-- Sort Controls -->
      <div class="sort-controls">
        <label for="sortSelect">Sort by:</label>
        <select id="sortSelect" class="sort-select" aria-label="Sort books by">
          <option value="date-desc">Date Added (Newest)</option>
          <option value="date-asc">Date Added (Oldest)</option>
          <option value="title">Title (A-Z)</option>
          <option value="author">Author (A-Z)</option>
        </select>
      </div>
      
      <div class="shelf-controls">
        <div class="shelf-input-group">
          <input
            type="text"
            id="shelfInput"
            class="shelf-input"
            placeholder="Create a new shelf (e.g. Favourites, Borrowed)…"
            aria-label="New shelf name"
          >
          <button id="createShelfBtn" class="btn btn-create-shelf">Add Shelf</button>
        </div>
        <div id="shelves" class="shelves-list" aria-label="Available shelves"></div>
      </div>
    </section>

    <!-- Reading List Section -->
    <section class="reading-list-section">
      <h2>Reading List by Shelf</h2>
      <div id="reading-list" class="reading-list-by-shelf" aria-label="Saved books by shelf"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
